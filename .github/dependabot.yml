version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 1
